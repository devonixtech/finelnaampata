providers = ["node"]

[phases.install]
cmds = ["npm install --include=dev"]

[phases.build]
cmds = [
    "rm -rf backend/dist backend/tsconfig.tsbuildinfo",
    "npm install",
    "npm run build --workspace=@business-saas/api",
    "ls -la backend/dist/entities",
    "echo '--- BUILD COMPLETE ---'"
]

[start]
cmd = "npm run start:prod --prefix backend"
